databaseChangeLog:
  - changeSet:
      id: 001-create-patients
      author: safia
      changes:
        - createTable:
            tableName: patients
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: diagnosis
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: treatment
                  type: VARCHAR(1000)
              - column:
                  name: status
                  type: VARCHAR(30)
                  defaultValue: IN_TREATMENT
                  constraints:
                    nullable: false
              - column:
                  name: admission_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: discharge_date
                  type: DATE
        - sql:
            sql: ALTER TABLE patients ADD CONSTRAINT chk_patients_status CHECK (status in ('IN_TREATMENT', 'DISCHARGED'));
        - createIndex:
            tableName: patients
            indexName: idx_patients_status
            columns:
              - column:
                  name: status
